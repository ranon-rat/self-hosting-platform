<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Project - Self Hosting Manager</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/form.css">
</head>
<body class="center-page">
    <div class="form-wrapper form-wrapper-wide">
        <div class="card">
            <div class="form-header">
                <h1>Create New Project</h1>
                <p>Fill in the details to create a new project</p>
            </div>

            <form id="create-project-form" class="form-fields">
                <div class="field">
                    <label for="name">Project Name</label>
                    <input
                        type="text"
                        name="name"
                        id="name"
                        placeholder="My Awesome Project"
                        class="input"
                        required
                    >
                </div>

                <div class="field">
                    <label for="dir">Directory Path</label>
                    <input
                        type="text"
                        name="dir"
                        id="dir"
                        placeholder="/path/to/project"
                        class="input"
                        required
                    >
                </div>

                <div class="field">
                    <label for="command">Command</label>
                    <input
                        type="text"
                        name="command"
                        id="command"
                        placeholder="npm start"
                        class="input"
                        required
                    >
                </div>

                <div class="field">
                    <label for="thumbnail_url">Thumbnail URL</label>
                    <input
                        type="url"
                        name="thumbnail_url"
                        id="thumbnail_url"
                        placeholder="https://example.com/thumbnail.png"
                        class="input"
                    >
                </div>

                <div class="form-actions">
                    <a href="/index.html">
                        <button
                            type="button"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </button>
                    </a>
                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Create Project
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="dist/createproject.js" type="module"></script>
</body>
</html>
