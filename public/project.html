<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/project.css">
</head>
<body>
    <div id="app" class="container stack">
        <div class="back-row">
            <a href="/index.html" class="link">
                ← Back to Projects
            </a>
        </div>

        <div id="project-details">
            <!--project details should be rendered here-->
        </div>

        <div id="project-buttons" class="buttons-row">
            <!--if the project is paused, show the resume button, otherwise show the pause button-->
            <button
                id="edit-project-button"
                class="btn btn-blue"
            >
                ✏️ Edit Project
            </button>
            <button
                id="pause-project-button"
                class="btn btn-warning"
            >
                ⏸ Pause Project
            </button>
            <button
                id="resume-project-button"
                class="btn btn-success hidden"
            >
                ▶ Resume Project
            </button>
            <button
                id="delete-project-button"
                class="btn btn-danger"
            >
                🗑 Delete Project
            </button>
        </div>

        <div id="project-logs" class="card">
            <div class="logs-header">
                <h2 class="logs-title">Project Logs</h2>
                <button
                    id="more-logs-button"
                    class="btn btn-blue btn-sm"
                >
                    📜 Load More Logs
                </button>
            </div>
            <div
                id="project-logs-container"
                class="logs-container"
            >
                <!--project logs should be rendered here-->
            </div>
        </div>
    </div>
    <script src="dist/loadproject.js" type="module"></script>
    <script src="dist/loggerLoader.js" type="module"></script>
</body>
</html>
